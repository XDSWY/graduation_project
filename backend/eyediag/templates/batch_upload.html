{% extends 'base.html' %}

{% block title %}批量上传 - 眼底病筛查{% endblock %}

{% block content %}
<style>
    .batch-container {
        max-width: 800px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .batch-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .batch-header h2 {
        color: #333;
        font-size: 2em;
        margin-bottom: 10px;
    }

    .batch-header p {
        color: #666;
    }

    .upload-area {
        border: 3px dashed #667eea;
        border-radius: 15px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        background: #f8f9fa;
        margin-bottom: 20px;
    }

    .upload-area:hover {
        border-color: #764ba2;
        background: #f0f3ff;
    }

    .upload-area i {
        font-size: 4em;
        color: #667eea;
        margin-bottom: 15px;
    }

    .file-input {
        display: none;
    }

    .file-list {
        margin-top: 20px;
        max-height: 300px;
        overflow-y: auto;
    }

    .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #eee;
        animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(-20px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .file-name {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .file-name i {
        color: #667eea;
        font-size: 1.2em;
    }

    .file-size {
        color: #999;
        font-size: 0.9em;
    }

    .remove-file {
        color: #ff6b6b;
        cursor: pointer;
        padding: 5px;
        border-radius: 50%;
        transition: all 0.3s;
    }

    .remove-file:hover {
        background: #ff6b6b;
        color: white;
    }

    .btn-batch {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        font-size: 1.1em;
        cursor: pointer;
        transition: all 0.3s;
        width: 100%;
        margin-top: 20px;
    }

    .btn-batch:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-batch:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .loading {
        display: none;
        text-align: center;
        margin-top: 20px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 10px;
    }

    .progress {
        height: 10px;
        margin: 15px 0;
        border-radius: 5px;
        overflow: hidden;
    }

    .progress-bar {
        background: linear-gradient(90deg, #667eea, #764ba2);
        width: 0%;
        height: 100%;
        transition: width 0.3s;
    }

    .file-count {
        color: #667eea;
        font-weight: bold;
        margin-top: 10px;
    }
</style>

<div class="batch-container">
    <div class="batch-header">
        <h2>📁 批量上传</h2>
        <p>支持同时上传多张图片，自动生成诊断报告</p>
    </div>

    <form method="post" enctype="multipart/form-data" id="batchForm">
        {% csrf_token %}
        
        <!-- 上传区域 -->
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <i class="bi bi-files"></i>
            <p>点击此处选择多张图片</p>
            <p class="text-muted small">支持 JPG、PNG 格式，可多选</p>
            <input type="file" id="fileInput" name="images" class="file-input" accept="image/*" multiple onchange="handleFiles(this)">
        </div>

        <!-- 文件列表 -->
        <div class="file-list" id="fileList"></div>

        <!-- 提交按钮 -->
        <button type="submit" class="btn-batch" id="submitBtn" disabled>
            <i class="bi bi-download"></i> 开始批量诊断并下载报告
        </button>

        <!-- 加载动画 -->
        <div class="loading" id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">正在处理中，请稍候...</p>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="file-count" id="fileCount">已处理 0/0 张</div>
        </div>
    </form>
</div>

<script>
let selectedFiles = [];

function handleFiles(input) {
    selectedFiles = Array.from(input.files);
    updateFileList();
}

function updateFileList() {
    const fileList = document.getElementById('fileList');
    const submitBtn = document.getElementById('submitBtn');
    
    if (selectedFiles.length > 0) {
        fileList.innerHTML = '';
        selectedFiles.forEach((file, index) => {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <div class="file-name">
                    <i class="bi bi-file-earmark-image"></i>
                    <span>${file.name}</span>
                    <span class="file-size">(${(file.size / 1024).toFixed(2)} KB)</span>
                </div>
                <span class="remove-file" onclick="removeFile(${index})">
                    <i class="bi bi-x-circle"></i>
                </span>
            `;
            fileList.appendChild(fileItem);
        });
        submitBtn.disabled = false;
    } else {
        fileList.innerHTML = '<p class="text-center text-muted">未选择任何文件</p>';
        submitBtn.disabled = true;
    }
}

function removeFile(index) {
    selectedFiles.splice(index, 1);
    
    // 更新input的files
    const dataTransfer = new DataTransfer();
    selectedFiles.forEach(file => dataTransfer.items.add(file));
    document.getElementById('fileInput').files = dataTransfer.files;
    
    updateFileList();
}

document.getElementById('batchForm').addEventListener('submit', function(e) {
    if (selectedFiles.length === 0) {
        e.preventDefault();
        alert('请至少选择一张图片');
        return;
    }
    
    document.getElementById('loading').style.display = 'block';
    document.getElementById('submitBtn').disabled = true;
    
    // 模拟进度条
    let progress = 0;
    const interval = setInterval(() => {
        progress += 2;
        document.getElementById('progressBar').style.width = progress + '%';
        document.getElementById('fileCount').textContent = 
            `已处理 ${Math.floor(progress / (100/selectedFiles.length))}/${selectedFiles.length} 张`;
        
        if (progress >= 100) {
            clearInterval(interval);
        }
    }, 100);
});
</script>
{% endblock %}
